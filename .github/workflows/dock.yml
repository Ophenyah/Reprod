name: GitHub Actions Repro
run-name: Ca dockerise un max 🦈
on: [push]
permissions:
  contents: write
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./TP1
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rep-lab2 .
      - run: docker run --rm --user "$(id -u):$(id -g)"  -v "$(pwd)":/out rep-lab2 
