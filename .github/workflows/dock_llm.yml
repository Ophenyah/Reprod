name: GitHub Actions Repro LLM
run-name: Ca LLMise un max 🦈
on: [push]
permissions:
  contents: write
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./TP2LLM
    steps:
      - name: Cleanup
        run: rm -f answer_associativity_llm.txt answer_banking_llm.txt
      - uses: actions/checkout@v4
      - run: docker build -t rep-lab2-llm .
      - run: docker run --rm --user "$(id -u):$(id -g)"  -v "$(pwd)":/out rep-lab2-llm
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "generated"
          git push
